name: Deploy Project
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v5
      - name: Install dependecies
        run: npm ci
      - name: Build Project
        run: npm run test
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [a, b, c]
    steps:
      - name: Get Code
        uses: actions/checkout@v5
      - name: Install dependencies
        run: npm ci
      - name: Build Project
        run: npm run build
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.version}}
          path: |
            dist
            package.json
