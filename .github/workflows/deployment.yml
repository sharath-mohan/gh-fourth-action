name: Deploy Project
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v5
      - name: Cache Dependencies
        uses: actions/cache@v4
        id: cache
        with:
          path: ~/.npm #https://github.com/actions/cache/blob/main/examples.md#node---npm
          key: deps-node-modules-${{ hashFiles('**/package-lock.json')}}
      - name: Install dependecies
        run: npm ci
      - name: Build Project
        run: npm run test
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      scripts-file: ${{steps.publish.outputs.script-file}}
    steps:
      - name: Get Code
        uses: actions/checkout@v5
      - name: Cache Dependencies
        uses: actions/cache@v4
        id: cache
        with:
          path: ~/.npm #https://github.com/actions/cache/blob/main/examples.md#node---npm
          key: deps-node-modules-${{ hashFiles('**/package-lock.json')}}
      - name: Install dependencies
        run: npm ci
      - name: Build Project
        run: npm run build
      - name: Publish File Name
        id: publish
        run: find dist/assets/*.js -type f -execdir echo "script-file={}" >> $GITHUB_OUTPUT ";"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4 # creates the artifact
        with:
          name: dist
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v5
        with:
          name: dist
      - name: Output Contents
        run: ls -R
      - name: Output file name
        run: echo "${{ needs.build.outputs.scripts-file }}"
      - name: Deploy to Server
        run: echo "Deploying to server..."
